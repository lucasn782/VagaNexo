name: CI

on:
  pull_request:
    branches:
      - main
      - feat/resume-import
      - feat/auth-multitenancy
  push:
    branches:
      - main
      - feat/resume-import
      - feat/auth-multitenancy

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-linux:
    name: Backend (Linux / PostgreSQL 17 + Redis 7)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: vaganexo
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: vaganexo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vaganexo"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+psycopg://vaganexo:ci-test-password@127.0.0.1:5432/vaganexo_test
      TEST_DATABASE_URL: postgresql+psycopg://vaganexo:ci-test-password@127.0.0.1:5432/vaganexo_test
      REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python 3.13
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install backend dependencies (locked)
        working-directory: backend
        run: uv sync --locked

      - name: Verify native POSIX dir_fd support and run POSIX TOCTOU test
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          uv run python -c "
          import os, sys
          from app.resume_import import storage
          assert sys.platform.startswith('linux'), f'Expected Linux, got {sys.platform}'
          assert storage._SUPPORTS_POSIX_PINNING, 'POSIX dir_fd pinning must be enabled on Linux'
          for fn in (os.open, os.stat, os.mkdir, os.unlink, os.link):
              assert fn in os.supports_dir_fd, f'{fn} missing from os.supports_dir_fd'
          print('POSIX dir_fd support verified:', sorted(f.__name__ for f in os.supports_dir_fd if hasattr(f, '__name__')))
          "
          uv run pytest tests/unit/test_storage_toctou.py -k test_toctou_real_posix_pinned_descriptor_survives_rename -v -rs --no-cov | tee posix_test.log
          grep -q "1 passed" posix_test.log

      - name: Run full backend test suite with coverage
        working-directory: backend
        run: uv run pytest -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Run Ruff lint
        working-directory: backend
        run: uv run ruff check .

      - name: Run Ruff format check
        working-directory: backend
        run: uv run ruff format --check .

      - name: Run Mypy type check
        working-directory: backend
        run: uv run mypy app

  backend-windows:
    name: Backend Filesystem & Unit Checks (Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python 3.13
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install backend dependencies (locked)
        working-directory: backend
        run: uv sync --locked

      - name: Run Windows filesystem, parser, validator, and schema tests
        working-directory: backend
        run: |
          uv run pytest -v --no-cov `
            tests/unit/test_storage_toctou.py `
            tests/unit/test_pdf_parser.py `
            tests/unit/test_docx_parser.py `
            tests/unit/test_file_validator.py `
            tests/unit/test_text_normalizer.py `
            tests/unit/test_profile_schemas.py `
            tests/unit/test_health.py

  frontend:
    name: Frontend (Next.js / TypeScript / ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Generate Next.js types and run TypeScript type check
        working-directory: frontend
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

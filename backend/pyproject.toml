[project]
name = "vaganexo-backend"
version = "0.1.0"
description = "Backend da plataforma VagaNexo AI"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "celery[redis]>=5.4",
    "docxtpl>=0.19",
    "fastapi>=0.115",
    "httpx>=0.28",
    "openai>=1.60",
    "pillow>=11",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pymupdf>=1.25",
    "python-docx>=1.1",
    "python-multipart>=0.0.18",
    "sentence-transformers>=3.3",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=app --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
packages = ["app"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
ignore_missing_imports = true
